<!doctype html>
<html lang="en" data-theme="thunderhead">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StormReel</title>
<meta name="description" content="Track every film and series you watch. Rate in bolts, keep a diary, see what your friends think.">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b111d'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%237cc4ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ THEMES ============ */
:root, :root[data-theme="thunderhead"]{
  --sky-1:#04060b; --sky-2:#0d1424; --sky-3:#1a2336; --mist:rgba(26,35,54,.85);
  --cloud-rgb:62 74 98; --lit-rgb:205 224 255; --rain-rgb:160 188 228; --bolt-rgb:236 245 255; --glow-rgb:124 182 255;
  --surface:rgba(12,17,28,.72); --surface-2:rgba(28,37,56,.72); --line:rgba(140,175,230,.16);
  --text:#e9eefb; --muted:#93a0b8; --accent:#7cc4ff; --accent-ink:#04121f; --danger:#ff7a6e;
  color-scheme:dark;
}
:root[data-theme="overcast"]{
  --sky-1:#aeb8c6; --sky-2:#d3dae3; --sky-3:#eef1f5; --mist:rgba(238,241,245,.9);
  --cloud-rgb:112 124 144; --lit-rgb:255 255 255; --rain-rgb:66 82 108; --bolt-rgb:255 255 255; --glow-rgb:96 128 255;
  --surface:rgba(255,255,255,.74); --surface-2:rgba(233,238,245,.86); --line:rgba(30,50,90,.14);
  --text:#101624; --muted:#535f72; --accent:#2c55d6; --accent-ink:#ffffff; --danger:#c8382c;
  color-scheme:light;
}
:root[data-theme="supercell"]{
  --sky-1:#020604; --sky-2:#0b1a13; --sky-3:#25351f; --mist:rgba(37,53,31,.85);
  --cloud-rgb:48 70 56; --lit-rgb:232 255 206; --rain-rgb:170 210 182; --bolt-rgb:247 255 230; --glow-rgb:182 255 106;
  --surface:rgba(8,18,13,.72); --surface-2:rgba(22,38,28,.74); --line:rgba(180,240,160,.15);
  --text:#e9f4e6; --muted:#93a896; --accent:#c4f26b; --accent-ink:#0d1a06; --danger:#ff8c6e;
  color-scheme:dark;
}
:root{ --flash:0; --r:12px; --display:"Big Shoulders Display", Impact, sans-serif; }

/* ============ BASE ============ */
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--sky-1)}
body{
  min-height:100vh; color:var(--text);
  font:15px/1.55 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 55%,var(--sky-3) 100%) fixed;
  overflow-x:hidden;
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.mist{position:fixed;left:0;right:0;bottom:0;height:34vh;pointer-events:none;z-index:0;background:linear-gradient(transparent,var(--mist))}
header,main,footer{position:relative;z-index:1}

/* ============ HEADER ============ */
header{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--sky-1) 70%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 1px 0 rgba(var(--glow-rgb),calc(var(--flash)*.6))}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"logo nav tools";gap:10px 18px;align-items:center}
.logo{grid-area:logo;display:flex;align-items:center;gap:9px;text-decoration:none;background:none;border:0;padding:0}
.logo svg{width:30px;height:30px;color:var(--accent);filter:drop-shadow(0 0 calc(4px + var(--flash)*16px) rgba(var(--glow-rgb),.7));transition:transform .3s}
.logo:hover svg{transform:rotate(-12deg) scale(1.08)}
.word{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.word b{color:var(--accent);font-weight:900}
nav{grid-area:nav;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;padding:7px 11px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--accent)}
.tools{grid-area:tools;display:flex;gap:8px;align-items:center}
.search{display:flex;position:relative}
.search input{width:220px;padding:8px 12px 8px 34px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
body[data-route="/"] .search{display:none}
.who{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.wx{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted)}
.wx svg{width:16px;height:16px;color:var(--accent)}
.wx:hover{color:var(--text)}
@media (max-width:1100px){
  .bar{grid-template-columns:1fr auto;grid-template-areas:"logo tools" "nav nav"}
}
@media (max-width:640px){
  .search{display:none}
  .wx span{display:none}
  .word{font-size:22px}
}

/* ============ LAYOUT ============ */
main{max-width:1240px;margin:0 auto;padding:24px 16px 80px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,52px);line-height:.95;letter-spacing:.005em;text-transform:uppercase;margin:6px 0 18px}
h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h small{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.narrow{max-width:440px;margin:48px auto}

/* ============ HERO ============ */
.hero{padding:7vh 0 4vh;max-width:900px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
.mega{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(60px,12vw,160px);line-height:.84;letter-spacing:-.005em;margin:0}
.mega span{color:transparent;-webkit-text-stroke:2px var(--accent);
  text-shadow:0 0 calc(18px + var(--flash)*70px) rgba(var(--glow-rgb),calc(.25 + var(--flash)*.7))}
.lede{font-size:18px;color:var(--text);opacity:.78;max-width:560px;margin:22px 0 26px;text-shadow:0 1px 14px var(--sky-1)}
.kicker,.mega{text-shadow:0 2px 24px color-mix(in srgb,var(--sky-1) 60%,transparent)}
.bigsearch{display:flex;gap:8px;max-width:620px;padding:6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 0 1px rgba(var(--glow-rgb),calc(var(--flash)*.8)), 0 20px 60px -30px rgba(var(--glow-rgb),.5)}
.bigsearch input{flex:1;min-width:0;border:0;background:none;padding:12px 14px;font-size:17px;outline:none}

/* ============ CONTROLS ============ */
.btn{border:1px solid var(--line);background:var(--surface-2);padding:9px 15px;border-radius:9px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,transform .15s}
.btn:hover{border-color:rgba(var(--glow-rgb),.6)}
.btn:active{transform:scale(.97)}
.btn.primary,.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{box-shadow:0 0 24px -4px rgba(var(--glow-rgb),.8)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.f{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2)}
textarea.f{min-height:100px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 5px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--accent);padding:0;font-weight:600;font-size:13px}

/* ============ CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.rail .card{flex:0 0 165px;scroll-snap-align:start}
.card{text-decoration:none;display:block;position:relative}
.poster{aspect-ratio:2/3;border-radius:10px;background:var(--surface-2);overflow:hidden;position:relative;border:1px solid var(--line);transition:transform .25s, box-shadow .25s}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .noimg{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;color:var(--muted)}
.card:hover .poster{transform:translateY(-4px);box-shadow:0 0 0 2px var(--accent),0 18px 40px -16px rgba(var(--glow-rgb),.7)}
.card .t{margin-top:9px;font-weight:700;font-size:14px;line-height:1.3}
.card .m{font-size:12px;color:var(--muted)}
.tag{position:absolute;top:8px;left:8px;background:rgba(3,6,12,.75);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:5px;text-transform:uppercase}
.rank{position:absolute;right:8px;bottom:4px;font-family:var(--display);font-weight:900;font-size:54px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.85);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.skel{background:linear-gradient(100deg,var(--surface-2) 30%,rgba(var(--glow-rgb),.12) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:sheen 1.4s linear infinite}
@keyframes sheen{from{background-position:100% 0}to{background-position:-100% 0}}

/* ============ TITLE PAGE ============ */
.feature{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.feature .bd{position:absolute;inset:0;background-size:cover;background-position:center 25%;opacity:.38;mask-image:linear-gradient(90deg,transparent 0%,#000 55%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%)}
.feature .in{position:relative;display:grid;grid-template-columns:230px 1fr;gap:28px;padding:28px}
.feature .poster{box-shadow:0 30px 60px -25px rgba(0,0,0,.8)}
@media (max-width:720px){.feature .in{grid-template-columns:1fr;padding:18px}.feature .in .poster{max-width:190px}}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:12px;font-weight:600;border:1px solid var(--line);padding:3px 10px;border-radius:20px;color:var(--muted);background:var(--surface-2)}
.bolts{display:flex;gap:2px}
.bolts button{background:none;border:0;padding:3px;line-height:0}
.bolts svg{width:30px;height:30px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round;transition:transform .15s,fill .15s}
.bolts button:hover svg{transform:scale(1.15)}
.bolts button.lit svg{fill:var(--accent);stroke:var(--accent);filter:drop-shadow(0 0 6px rgba(var(--glow-rgb),.7))}
.mini svg{width:14px;height:14px;fill:var(--accent);vertical-align:-2px}
.mini svg.off{fill:none;stroke:var(--muted);stroke-width:1.5}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000}
.review{border-top:1px solid var(--line);padding:14px 0}
.review:first-child{border-top:0;padding-top:0}

.tag.free{left:auto;right:8px;background:var(--accent);color:var(--accent-ink)}
.btn.play{padding:12px 22px;font-size:16px}
.btn.play svg{width:18px;height:18px}
.where-row{display:flex;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.where-row:first-child{border-top:0;padding-top:0}
.where-label{width:110px;flex:0 0 auto;font-size:13px;font-weight:700;color:var(--muted)}
.where-logos{display:flex;gap:8px;flex-wrap:wrap}
.where-logos img{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);transition:transform .15s}
.where-logos a:hover img{transform:translateY(-2px);box-shadow:0 0 0 2px var(--accent)}
@media (max-width:520px){.where-row{flex-direction:column;align-items:flex-start;gap:6px}}

/* ============ THEATER ============ */
.theater{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(2,4,9,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:rise .3s ease both}
.th-in{width:min(1200px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px}
.th-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;color:#e9eefb}
.th-title{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,40px);text-transform:uppercase;line-height:1}
.th-frame{position:relative;aspect-ratio:16/9;width:100%;max-height:calc(100vh - 140px);border-radius:14px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px rgba(var(--glow-rgb),.5),0 0 80px -10px rgba(var(--glow-rgb),.55)}
.th-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.th-foot{font-size:12px;color:#93a0b8}
.inline-player{scroll-margin-top:24px;margin-top:22px}
.inline-player .sec-h{display:flex;justify-content:space-between;align-items:center;gap:16px}
.inline-player .th-frame{max-height:none;aspect-ratio:16/9;width:100%;min-height:220px}
.inline-player .th-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(max-width:640px){.inline-player .th-frame{min-height:190px}}

/* ============ LISTS ============ */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:14px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.li img,.li .ph{width:46px;height:69px;object-fit:cover;border-radius:6px;background:var(--surface-2);flex:0 0 auto}
.li .grow{flex:1;min-width:0}
.li a.name{text-decoration:none;font-weight:700}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-family:var(--display);font-size:24px;text-transform:uppercase;color:var(--text);margin-bottom:4px}
.note{font-size:14px;color:var(--muted);border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);padding:10px 14px;border-radius:8px;margin:0 0 20px}
.note a{color:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme-card{border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--surface-2);text-align:left}
.theme-card .sw{height:58px}
.theme-card div:last-child{padding:8px 10px;font-weight:700;font-size:13px}
.theme-card.on{outline:2px solid var(--accent)}

/* ============ TOAST + FOOTER ============ */
.toast{position:fixed;top:76px;left:50%;transform:translate(-50%,-10px);display:flex;gap:8px;align-items:center;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:99;box-shadow:0 10px 40px -10px rgba(var(--glow-rgb),.9);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;fill:currentColor;flex:0 0 auto}
footer{border-top:1px solid var(--line);padding:26px 16px 34px;color:var(--muted);font-size:12px;text-align:center;background:color-mix(in srgb,var(--sky-3) 70%,transparent)}
footer a{color:var(--muted)}
footer .word{font-size:18px;color:var(--text);display:block;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="mist" aria-hidden="true"></div>

<header>
  <div class="bar">
    <a href="#/" class="logo" id="logo" aria-label="StormReel home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="16" cy="7.6" r="2.3" fill="currentColor"/><circle cx="24.4" cy="16" r="2.3" fill="currentColor"/>
        <circle cx="16" cy="24.4" r="2.3" fill="currentColor"/><circle cx="7.6" cy="16" r="2.3" fill="currentColor"/>
        <path d="M18.6 2.5 9.5 17.2h6.2l-2.3 12.3 9.4-15.3h-6.3z" fill="currentColor" stroke="var(--sky-1)" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="word">Storm<b>Reel</b></span>
    </a>
    <nav id="nav"></nav>
    <div class="tools">
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search" aria-label="Search films and series">
      </form>
      <button class="wx" id="wx" title="Change the weather"></button>
      <div class="who" id="who"></div>
    </div>
  </div>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   STORMREEL
   ---------------------------------------------------------------------
   Fill these in after you create your free Supabase project
   (see README). Leave them blank and accounts are kept in each
   visitor's browser only.
   ===================================================================== */
const CONFIG = {
  supabaseUrl: "https://lqdfpxtcajtajsyqsjrr.supabase.co",
  supabaseKey: "sb_publishable_WpPCP1iDRWD5NQTqVVRyvA_oGHMMltv",   // publishable key: safe to be public
  tmdbKey: "3e76387463be5c6005410051ffa6e933",  // TMDB key every visitor shares (unlocks movies)
  // People sign in with just a username. Supabase still needs an email behind
  // the scenes, so "bob" becomes "bob@<loginDomain>". No mail is ever sent
  // (turn OFF "Confirm email" in Supabase). Don't change this after people join.
  loginDomain: "users.stormreel.app"
};
const loginEmail = name => { const n = name.trim().toLowerCase().replace(/^@/, ""); return n.includes("@") ? n : `${n}@${CONFIG.loginDomain}` };
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js";

/* =====================================================================
   1. METADATA PROVIDERS  (where film/TV info comes from)
   Every provider returns the same normalized title:
   { id:"tmdb:movie:603", provider, type:"movie"|"tv", title, year, overview,
     poster, backdrop, score, genres[], runtime, trailer, cast[], recs[], link }
   ===================================================================== */
const TMDBProvider = {
  name: "tmdb", label: "TMDB (films + series)", img: "https://image.tmdb.org/t/p/",
  key(){ return LocalStore.settings().tmdbKey || CONFIG.tmdbKey || "" },
  ready(){ return !!this.key() },
  async get(path, params = {}){
    const k = this.key();
    const url = new URL("https://api.themoviedb.org/3" + path);
    const headers = { accept: "application/json" };
    if (k.startsWith("eyJ")) headers.Authorization = "Bearer " + k; else url.searchParams.set("api_key", k);
    for (const [a, b] of Object.entries(params)) url.searchParams.set(a, b);
    return cachedFetch(url.toString(), { headers });
  },
  norm(r, forcedType){
    const type = forcedType || r.media_type || (r.first_air_date !== undefined ? "tv" : "movie");
    if (type === "person") return null;
    const date = r.release_date || r.first_air_date || "";
    return {
      id: `tmdb:${type}:${r.id}`, provider: "tmdb", type,
      title: r.title || r.name || "Untitled", year: date.slice(0, 4), overview: r.overview || "",
      poster: r.poster_path ? this.img + "w342" + r.poster_path : "",
      backdrop: r.backdrop_path ? this.img + "w1280" + r.backdrop_path : "",
      score: r.vote_average ? Math.round(r.vote_average * 10) / 10 : null,
      genres: (r.genres || []).map(g => g.name),
      runtime: r.runtime || (r.episode_run_time || [])[0] || null,
      link: `https://www.themoviedb.org/${type}/${r.id}`
    };
  },
  async basic(id){ const [, type, tid] = id.split(":"); return this.norm(await this.get(`/${type}/${tid}`), type) },
  async trending(){ return (await this.get("/trending/all/week")).results.map(r => this.norm(r)).filter(Boolean) },
  async popular(type){ return (await this.get(`/${type}/popular`)).results.map(r => this.norm(r, type)) },
  async search(q){ return (await this.get("/search/multi", { query: q, include_adult: "false" })).results.map(r => this.norm(r)).filter(Boolean) },
  async details(id){
    const [, type, tid] = id.split(":");
    const d = await this.get(`/${type}/${tid}`, { append_to_response: "videos,credits,recommendations,watch/providers" });
    const t = this.norm(d, type);
    t.where = (d["watch/providers"]?.results || {})[REGION] || null;
    t.seasons = type === "tv" ? (d.seasons || []).map(season => ({
      season_number: Number(season.season_number),
      episode_count: Number(season.episode_count) || 1,
      name: season.name || `Season ${season.season_number}`
    })) : [];
    const vids = (d.videos?.results || []).filter(v => v.site === "YouTube");
    t.trailer = (vids.find(v => v.type === "Trailer" && v.official) || vids.find(v => v.type === "Trailer") || vids[0])?.key || null;
    t.cast = (d.credits?.cast || []).slice(0, 14).map(c => ({ name: c.name, role: c.character }));
    t.recs = (d.recommendations?.results || []).slice(0, 14).map(r => this.norm(r, type));
    return t;
  },
  attribution: 'Film and series data from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.'
};

const TVmazeProvider = {

  norm(s){
    return {
      id: `tvmaze:tv:${s.id}`, provider: "tvmaze", type: "tv", title: s.name, year: (s.premiered || "").slice(0, 4),
      overview: this.strip(s.summary), poster: s.image?.medium || "", backdrop: s.image?.original || "",

    const today = new Date().toISOString().slice(0, 10);
    const sched = await cachedFetch(`https://api.tvmaze.com/schedule/web?date=${today}`);
    const seen = new Set(), out = [];
    for (const ep of sched) { const s = ep._embedded?.show || ep.show; if (s && !seen.has(s.id) && s.image) { seen.add(s.id); out.push(this.norm(s)) } }

};

const Streams = {
  name: "stellar",
  language(){
    const locale = String(navigator.language || "en").toLowerCase();
    if (locale === "zh-tw" || locale.startsWith("zh-hant")) return "zh-TW";
    if (locale.startsWith("zh")) return "zh-CN";
    if (locale === "es-es") return "es-ES";
    if (locale.startsWith("es-") && locale !== "es-es") return "es-419";
    if (locale === "pt-br" || locale.startsWith("pt-")) return "pt-BR";
    const code = locale.split("-")[0];
    const supported = ["en","fr","fil","nl","de","it","ko","ja","hi","ru","ar"];
    return supported.includes(code) ? code : "en";
  },
  find(titleOrId, season = 1, episode = 1){
    const title = titleOrId && typeof titleOrId === "object" ? titleOrId : null;
    const rawId = String(title ? title.id || "" : titleOrId || "");
    let mediaType = null, tmdbId = null;
    let match = rawId.match(/^tmdb:(movie|tv):(\d+)$/i);
    if (match) { mediaType = match[1].toLowerCase(); tmdbId = match[2]; }
    if (!tmdbId && title?.link) {
      match = String(title.link).match(/themoviedb\.org\/(movie|tv)\/(\d+)/i);
      if (match) { mediaType = match[1].toLowerCase(); tmdbId = match[2]; }
    }
    if (!tmdbId && title && /^\d+$/.test(rawId) && ["movie","tv"].includes(String(title.type).toLowerCase())) {
      mediaType = String(title.type).toLowerCase(); tmdbId = rawId;
    }
    if (!/^\d+$/.test(String(tmdbId || "")) || !["movie","tv"].includes(mediaType)) return null;
    const lang = this.language();
    const url = mediaType === "movie"
      ? `https://stellar.rip/${lang}/watch/embed/movie/${tmdbId}`
      : `https://stellar.rip/${lang}/watch/embed/tv/${tmdbId}-${Math.max(0, Number(season) || 1)}-${Math.max(1, Number(episode) || 1)}`;
    return { embed: url, from: "Stellar", tmdbId, mediaType, season, episode };
  }
};

const memCache = new Map();
async function cachedFetch(url, opts = {}){
  if (memCache.has(url)) return memCache.get(url);
  try { const s = sessionStorage.getItem("c:" + url); if (s) { const v = JSON.parse(s); memCache.set(url, v); return v } } catch {}
  let res = await fetch(url, opts);
  if (res.status === 429) { await new Promise(r => setTimeout(r, 2000)); res = await fetch(url, opts) }
  if (!res.ok) throw new Error(res.status === 401 ? "The TMDB key was rejected. Check it in Settings." : "Couldn't load that (" + res.status + ").");
  const v = await res.json();
  memCache.set(url, v);
  try { sessionStorage.setItem("c:" + url, JSON.stringify(v)) } catch {}
  return v;
}

/* =====================================================================
   2. OUR DATA  (accounts, ratings, reviews, diary, lists, friends)
   Two stores with the same methods. CloudStore (Supabase) is used when
   CONFIG has Supabase details; otherwise LocalStore (this browser only).
   Both keep the signed-in user's data in memory as `me` with this shape:
   { username, theme, ratings:{id:{stars,at}}, reviews:{id:{text,at}},
     history:[{id,at,hid}], watchlist:[id], collections:{name:[id]},
     friends:[username], titles:{id:snapshot} }
   ===================================================================== */
const snap = t => ({ id: t.id, type: t.type, title: t.title, year: t.year, poster: t.poster });
const usernameOk = u => /^[a-z0-9_]{3,20}$/.test(u);

const LocalStore = {
  mode: "local", KEY: "stormreel.db.v1", _d: null,
  get d(){
    if (!this._d) { try { this._d = JSON.parse(localStorage.getItem(this.KEY)) } catch {} this._d ||= { users: {}, session: null, settings: {} } }
    return this._d;
  },
  commit(){ try { localStorage.setItem(this.KEY, JSON.stringify(this.d)) } catch { toast("Couldn't save. Is browser storage blocked?") } },
  settings(){ return this.d.settings },
  setSetting(k, v){ this.d.settings[k] = v; this.commit() },
  async init(){},
  async hash(pw, salt){
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(salt), iterations: 150000, hash: "SHA-256" }, base, 256);
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
  },
  async signUp({ username, password }){
    username = username.trim().toLowerCase();
    if (!usernameOk(username)) throw new Error("Username: 3 to 20 lowercase letters, numbers or underscores.");
    if (password.length < 8) throw new Error("Password needs at least 8 characters.");
    if (this.d.users[username]) throw new Error("That username is taken.");
    const salt = crypto.getRandomValues(new Uint32Array(4)).join("-");
    this.d.users[username] = { username, salt, hash: await this.hash(password, salt), theme: this.d.settings.theme || "thunderhead",
      ratings: {}, reviews: {}, history: [], watchlist: [], collections: {}, friends: [], titles: {} };
    this.d.session = username; this.commit();
    return { signedIn: true };
  },
  async signIn({ login, password }){
    const u = this.d.users[login.trim().toLowerCase()];
    if (!u || (await this.hash(password, u.salt)) !== u.hash) throw new Error("Wrong username or password.");
    this.d.session = u.username; this.commit();
  },
  async signOut(){ this.d.session = null; this.commit() },
  me(){ return this.d.session ? this.d.users[this.d.session] : null },
  remember(t){ this.me().titles[t.id] = snap(t) },
  async rate(t, stars){ const u = this.me(); this.remember(t); if (stars) u.ratings[t.id] = { stars, at: Date.now() }; else delete u.ratings[t.id]; this.commit() },
  async review(t, text){ const u = this.me(); this.remember(t); if (text.trim()) u.reviews[t.id] = { text: text.trim(), at: Date.now() }; else delete u.reviews[t.id]; this.commit() },
  async toggleWatchlist(t){ const u = this.me(); this.remember(t); const i = u.watchlist.indexOf(t.id); i >= 0 ? u.watchlist.splice(i, 1) : u.watchlist.unshift(t.id); this.commit(); return i < 0 },
  async logWatch(t){ const u = this.me(); this.remember(t); u.history.unshift({ id: t.id, at: Date.now() }); u.watchlist = u.watchlist.filter(x => x !== t.id); this.commit() },
  async removeHistory(i){ this.me().history.splice(i, 1); this.commit() },
  async createCollection(name){ name = name.trim(); if (!name) return; this.me().collections[name] ||= []; this.commit() },
  async deleteCollection(name){ delete this.me().collections[name]; this.commit() },
  async toggleInCollection(name, t){ this.remember(t); const c = this.me().collections[name]; const i = c.indexOf(t.id); i >= 0 ? c.splice(i, 1) : c.unshift(t.id); this.commit() },
  async addFriend(name){
    const u = this.me(); name = name.trim().toLowerCase().replace(/^@/, "");
    if (name === u.username) throw new Error("That's you.");
    if (!this.d.users[name]) throw new Error("No one called @" + name + " here yet.");
    if (!u.friends.includes(name)) u.friends.push(name); this.commit();
  },
  async removeFriend(name){ const u = this.me(); u.friends = u.friends.filter(f => f !== name); this.commit() },
  async setTheme(th){ const u = this.me(); if (u) { u.theme = th; this.commit() } this.setSetting("theme", th) },
  async incoming(){ const me = this.me(); return Object.values(this.d.users).filter(x => x.friends.includes(me.username) && !me.friends.includes(x.username)).map(x => x.username) },
  async friendSummaries(){
    const me = this.me();
    return me.friends.map(n => this.d.users[n]).filter(Boolean).map(f => ({ username: f.username, ratings: Object.keys(f.ratings).length, watched: f.history.length,
      last: f.history[0] ? f.titles[f.history[0].id]?.title : null, mutual: f.friends.includes(me.username) }));
  },
  async friendView(name){
    const f = this.d.users[name]; if (!f || !this.me().friends.includes(name)) return null;
    return { username: f.username, mutual: true, ratings: f.ratings, reviews: f.reviews, history: f.history, titles: f.titles };
  },
  async friendsOnTitle(id){
    return this.me().friends.map(n => this.d.users[n]).filter(f => f && (f.ratings[id] || f.reviews[id]))
      .map(f => ({ username: f.username, stars: f.ratings[id]?.stars || 0, text: f.reviews[id]?.text || "" }));
  },
  exportMine(){ const u = structuredClone(this.me()); delete u.hash; delete u.salt; return u },
  async importMine(o){ const u = this.me(); for (const k of ["ratings", "reviews", "history", "watchlist", "collections", "titles"]) if (o[k]) u[k] = o[k]; this.commit() },
  async deleteAccount(){ delete this.d.users[this.d.session]; this.d.session = null; this.commit() }
};

const CloudStore = {
  mode: "cloud", sb: null, uid: null, mine: null, recovery: false,
  settings(){ return LocalStore.settings() },
  setSetting(k, v){ LocalStore.setSetting(k, v) },
  async w(p){ const r = await p; if (r.error) throw new Error(r.error.message); return r },
  async init(){
    this.sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
    this.sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") this.recovery = true });
    const { data: { session } } = await this.sb.auth.getSession();
    if (session) { try { await this.load(session.user) } catch (e) { console.error(e); toast(e.message) } }
  },
  async load(user){
    const uid = user.id, sb = this.sb;
    const q = t => sb.from(t).select("*").eq("user_id", uid);
    const [p, r, v, w, h, c, f] = await Promise.all([
      sb.from("profiles").select("username,theme").eq("id", uid).maybeSingle(),
      q("ratings"), q("reviews"), q("watchlist").order("added_at", { ascending: false }),
      q("history").order("watched_at", { ascending: false }).limit(1000),
      sb.from("collections").select("id,name,created_at,collection_items(title_id,title,added_at)").eq("user_id", uid).order("created_at"),
      sb.from("friends").select("friend_id").eq("user_id", uid)
    ]);
    for (const x of [p, r, v, w, h, c, f]) if (x.error) throw new Error(x.error.message);
    if (!p.data) throw new Error("Your profile is missing. Was the database schema installed?");
    const m = { username: p.data.username, email: user.email, theme: p.data.theme, ratings: {}, reviews: {}, history: [], watchlist: [], collections: {}, friends: [], titles: {}, _coll: {}, _fid: {} };
    const keep = (id, t) => { if (t && t.title) m.titles[id] = t };
    for (const x of r.data) { m.ratings[x.title_id] = { stars: x.stars, at: Date.parse(x.updated_at) }; keep(x.title_id, x.title) }
    for (const x of v.data) { m.reviews[x.title_id] = { text: x.body, at: Date.parse(x.updated_at) }; keep(x.title_id, x.title) }
    for (const x of w.data) { m.watchlist.push(x.title_id); keep(x.title_id, x.title) }
    for (const x of h.data) { m.history.push({ id: x.title_id, at: Date.parse(x.watched_at), hid: x.id }); keep(x.title_id, x.title) }
    for (const col of c.data) {
      m._coll[col.name] = col.id;
      m.collections[col.name] = (col.collection_items || []).sort((a, b) => Date.parse(b.added_at) - Date.parse(a.added_at)).map(i => (keep(i.title_id, i.title), i.title_id));
    }
    const ids = f.data.map(x => x.friend_id);
    if (ids.length) {
      const pr = await this.w(sb.from("profiles").select("id,username").in("id", ids));
      for (const x of pr.data) { m.friends.push(x.username); m._fid[x.username] = x.id }
    }
    this.uid = uid; this.mine = m;
  },
  async reload(){ const { data: { user } } = await this.sb.auth.getUser(); if (user) await this.load(user) },
  me(){ return this.mine },
  async signUp({ username, password }){
    username = username.trim().toLowerCase().replace(/^@/, "");
    if (!usernameOk(username)) throw new Error("Username: 3 to 20 lowercase letters, numbers or underscores.");
    if (password.length < 8) throw new Error("Password needs at least 8 characters.");
    const taken = await this.w(this.sb.from("profiles").select("id").eq("username", username).maybeSingle());
    if (taken.data) throw new Error("That username is taken.");
    const { data, error } = await this.sb.auth.signUp({ email: loginEmail(username), password, options: { data: { username } } });
    if (error) throw new Error(/email/i.test(error.message) ? `Supabase rejected the sign-in address (${error.message}). Change loginDomain in CONFIG.` : error.message);
    if (!data.session) throw new Error("Account made, but Supabase wants email confirmation. Turn off “Confirm email” in Supabase, then see the README to unlock this account.");
    await this.load(data.user); await this.setTheme(LocalStore.settings().theme || "thunderhead");
    return { signedIn: true };
  },
  async signIn({ login, password }){
    const { data, error } = await this.sb.auth.signInWithPassword({ email: loginEmail(login), password });
    if (error) throw new Error(error.message === "Invalid login credentials" ? "Wrong username or password." : error.message);
    await this.load(data.user);
  },
  async signOut(){ await this.sb.auth.signOut(); this.mine = null; this.uid = null },
  async sendReset(email){ const { error } = await this.sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname }); if (error) throw new Error(error.message) },
  async setPassword(pw){ if (pw.length < 8) throw new Error("Password needs at least 8 characters."); const { error } = await this.sb.auth.updateUser({ password: pw }); if (error) throw new Error(error.message); this.recovery = false },

  async rate(t, stars){
    const m = this.mine; m.titles[t.id] = snap(t);
    if (stars) { m.ratings[t.id] = { stars, at: Date.now() }; await this.w(this.sb.from("ratings").upsert({ user_id: this.uid, title_id: t.id, stars, title: snap(t), updated_at: new Date().toISOString() })) }
    else { delete m.ratings[t.id]; await this.w(this.sb.from("ratings").delete().eq("user_id", this.uid).eq("title_id", t.id)) }
  },
  async review(t, text){
    const m = this.mine; m.titles[t.id] = snap(t); text = text.trim();
    if (text) { m.reviews[t.id] = { text, at: Date.now() }; await this.w(this.sb.from("reviews").upsert({ user_id: this.uid, title_id: t.id, body: text, title: snap(t), updated_at: new Date().toISOString() })) }
    else { delete m.reviews[t.id]; await this.w(this.sb.from("reviews").delete().eq("user_id", this.uid).eq("title_id", t.id)) }
  },
  async toggleWatchlist(t){
    const m = this.mine; m.titles[t.id] = snap(t);
    const i = m.watchlist.indexOf(t.id);
    if (i >= 0) { m.watchlist.splice(i, 1); await this.w(this.sb.from("watchlist").delete().eq("user_id", this.uid).eq("title_id", t.id)); return false }
    m.watchlist.unshift(t.id); await this.w(this.sb.from("watchlist").upsert({ user_id: this.uid, title_id: t.id, title: snap(t) })); return true;
  },
  async logWatch(t){
    const m = this.mine; m.titles[t.id] = snap(t);
    const r = await this.w(this.sb.from("history").insert({ user_id: this.uid, title_id: t.id, title: snap(t) }).select("id,watched_at").single());
    m.history.unshift({ id: t.id, at: Date.parse(r.data.watched_at), hid: r.data.id });
    if (m.watchlist.includes(t.id)) { m.watchlist = m.watchlist.filter(x => x !== t.id); await this.w(this.sb.from("watchlist").delete().eq("user_id", this.uid).eq("title_id", t.id)) }
  },
  async removeHistory(i){ const [h] = this.mine.history.splice(i, 1); if (h?.hid) await this.w(this.sb.from("history").delete().eq("id", h.hid)) },
  async createCollection(name){

  },
  async deleteAccount(){ await this.w(this.sb.rpc("delete_me")); await this.sb.auth.signOut(); this.mine = null; this.uid = null }

let Store = LocalStore;

/* =====================================================================
   3. THE STORM  (animated canvas sky: clouds, rain, lightning)
   ===================================================================== */
const Storm = {
  levels: {
    calm:      { label: "Calm",      rain: 0,    light: 0,   wind: .05 },
    drizzle:   { label: "Drizzle",   rain: .3,   light: 0,   wind: .12 },
    storm:     { label: "Storm",     rain: 1,    light: 1,   wind: .25 },
    supercell: { label: "Supercell", rain: 1.9,  light: 2.4, wind: .45 }
  },
  order: ["calm", "drizzle", "storm", "supercell"],
  level: "storm", t: 0, last: 0, wind: -.2, gust: 0, flash: 0, drops: [], splashes: [], bolts: [], clouds: [], sprites: [],
  nextStrike: 2.5, running: false, still: matchMedia("(prefers-reduced-motion: reduce)").matches, mx: 0,

  init(){
    this.c = document.getElementById("sky"); this.x = this.c.getContext("2d");
    this.level = LocalStore.settings().weather || "storm";
    this.readColors(); this.resize();
    addEventListener("resize", () => { clearTimeout(this._r); this._r = setTimeout(() => this.resize(), 120) });
    document.addEventListener("visibilitychange", () => document.hidden ? this.stop() : this.start());
    addEventListener("pointermove", e => { this.mx = e.clientX / innerWidth - .5 }, { passive: true });
    this.start();
  },
  rgb(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim().split(/\s+/).join(",") },
  readColors(){
    this.col = { cloud: this.rgb("--cloud-rgb"), lit: this.rgb("--lit-rgb"), rain: this.rgb("--rain-rgb"), bolt: this.rgb("--bolt-rgb"), glow: this.rgb("--glow-rgb") };
    this.buildSprites();
  },
  resize(){
    this.dpr = Math.min(devicePixelRatio || 1, 1.5);
    this.w = innerWidth; this.h = innerHeight;
    this.c.width = this.w * this.dpr; this.c.height = this.h * this.dpr;
    this.x.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.spawnClouds(); this.spawnRain();
    if (this.still) this.frame(0);
  },
  setLevel(l){ this.level = l; LocalStore.setSetting("weather", l); this.spawnRain(); this.nextStrike = this.t + 1.2; if (this.still) this.frame(0) },
  cfg(){ return this.levels[this.level] || this.levels.storm },

  // --- clouds: soft puffs pre-rendered into sprites, drawn dark and "lit" ---
  buildSprites(){
    const rnd = mulberry(7);
    this.sprites = [];
    // highlight tint = cloud colour nudged toward the lit colour, for soft tops
    const a = this.col.cloud.split(",").map(Number), b = this.col.lit.split(",").map(Number);
    const hl = a.map((v, i) => Math.round(v + (b[i] - v) * .22)).join(",");
    for (let v = 0; v < 6; v++) {
      // generous padding so no puff is ever clipped by the sprite's edges
      const W = 900, H = 520, cx = W / 2, cy = 270, puffs = [];
      const n = 30 + Math.floor(rnd() * 16);
      for (let i = 0; i < n; i++) {
        const ang = rnd() * Math.PI * 2, r = Math.sqrt(rnd());
        puffs.push({ x: cx + Math.cos(ang) * r * 230, y: cy + Math.sin(ang) * r * 66 - rnd() * 36, s: 50 + rnd() * 90, o: .35 + rnd() * .4 });
      }
      const blob = (g, x, y, s, rgb, o) => {
        const gr = g.createRadialGradient(x, y, 0, x, y, s);
        gr.addColorStop(0, `rgba(${rgb},${o})`); gr.addColorStop(.6, `rgba(${rgb},${o * .45})`); gr.addColorStop(1, `rgba(${rgb},0)`);
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, s, 0, Math.PI * 2); g.fill();
      };
      const make = (rgb, k, tops) => {
        const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
        for (const p of puffs) blob(g, p.x, p.y, p.s, rgb, p.o * k);
        if (tops) for (const p of puffs) if (p.y < cy) blob(g, p.x, p.y - p.s * .28, p.s * .55, hl, p.o * .22);
        return cv;
      };
      this.sprites.push({ dark: make(this.col.cloud, 1, true), lit: make(this.col.lit, .9, false), W: W * .72, H: H * .72 });
    }
  },
  spawnClouds(){
    const rnd = mulberry(42); this.clouds = [];
    const layers = [{ d: .35, n: 6, y: [-.08, .12], s: [.7, 1.1], a: .55 }, { d: .65, n: 6, y: [-.04, .22], s: [1, 1.5], a: .75 }, { d: 1, n: 5, y: [.02, .32], s: [1.3, 2.1], a: .95 }];
    for (const L of layers) {
      const count = Math.max(3, Math.round(L.n * this.w / 1200)) + 1;
      for (let i = 0; i < count; i++) this.clouds.push({ sp: Math.floor(rnd() * 6), d: L.d, a: L.a, s: L.s[0] + rnd() * (L.s[1] - L.s[0]),
        x: (i / count) * (this.w + 800) - 400 + rnd() * 120, y: (L.y[0] + rnd() * (L.y[1] - L.y[0])) * this.h, v: 6 + rnd() * 8 });
    }
  },
  // --- rain ---
  spawnRain(){
    const n = Math.min(1100, Math.round(this.w * this.h / 5200 * this.cfg().rain));
    this.drops = Array.from({ length: n }, () => this.drop(true));
  },
  drop(anyY){
    const z = .25 + Math.random() * .75;
    return { x: Math.random() * (this.w + 400) - 200, y: anyY ? Math.random() * this.h : -Math.random() * 120, z, len: 8 + 26 * z, v: 700 + 900 * z };
  },
  // --- lightning ---
  strike(o = {}){
    if (this.still) return;
    const w = this.w, h = this.h;
    const x0 = o.x ?? w * (.1 + Math.random() * .8), y0 = h * (.04 + Math.random() * .14);
    const ground = o.big || Math.random() < .55;
    const x1 = x0 + (Math.random() - .5) * w * (ground ? .25 : .7), y1 = ground ? h * (.9 + Math.random() * .15) : h * (.3 + Math.random() * .25);
    const main = bolt(x0, y0, x1, y1, ground ? 140 : 90, ground ? 5 : 3.5);
    const branches = [];
    const nb = 2 + Math.floor(Math.random() * (ground ? 6 : 4));
    for (let i = 0; i < nb; i++) {
      const p = main[Math.floor(main.length * (.15 + Math.random() * .6))];
      const ang = Math.PI / 2 + (Math.random() - .5) * 1.8, L = (40 + Math.random() * 160) * (ground ? 1.4 : 1);
      branches.push(bolt(p.x, p.y, p.x + Math.cos(ang) * L * (Math.random() < .5 ? -1 : 1), p.y + Math.sin(ang) * L, 30, 2));
    }
    const pulses = [0]; if (Math.random() < .7) pulses.push(.07 + Math.random() * .06); if (Math.random() < .4 || o.big) pulses.push(.2 + Math.random() * .1);
    this.bolts.push({ main, branches, born: this.t, pulses, ground, x: x0, power: o.big ? 1.25 : (ground ? 1 : .6) });
    if (this.still) return;
  },
  brightness(b){
    const age = this.t - b.born; let v = 0;
    for (const p of b.pulses) if (age >= p) v = Math.max(v, Math.exp(-(age - p) * 11));
    return v;
  },

  start(){ if (this.running || this.still) return; this.running = true; this.last = performance.now(); requestAnimationFrame(n => this.loop(n)) },
  stop(){ this.running = false },
  loop(now){
    if (!this.running) return;
    const dt = Math.min(.05, (now - this.last) / 1000); this.last = now;
    this.frame(dt);
    requestAnimationFrame(n => this.loop(n));
  },
  frame(dt){
    const x = this.x, w = this.w, h = this.h, C = this.col, cfg = this.cfg();
    this.t += dt;
    // wind drifts with occasional gusts
    if (Math.random() < dt * .25) this.gust = (Math.random() - .3) * cfg.wind * 1.6;
    this.gust *= Math.pow(.6, dt);
    this.wind += ((-cfg.wind + this.gust) - this.wind) * Math.min(1, dt * .8);
    // lightning schedule
    if (cfg.light && this.t > this.nextStrike) { this.strike(); this.nextStrike = this.t + (3 + Math.random() * 9) / cfg.light }
    this.bolts = this.bolts.filter(b => this.t - b.born < 1.2);
    let flash = 0, fx = w / 2;
    for (const b of this.bolts) { const v = this.brightness(b) * b.power; if (v > flash) { flash = v; fx = b.x } }
    this.flash = flash;
    document.documentElement.style.setProperty("--flash", flash > .02 ? Math.min(1, flash).toFixed(3) : "0");

    x.clearRect(0, 0, w, h);
    // sky glow during flash
    if (flash > .02) {
      const g = x.createRadialGradient(fx, h * .15, 0, fx, h * .15, Math.max(w, h) * .9);
      g.addColorStop(0, `rgba(${C.glow},${.24 * flash})`); g.addColorStop(1, `rgba(${C.glow},0)`);
      x.fillStyle = g; x.fillRect(0, 0, w, h);
    }
    const drawClouds = layer => {
      for (const c of this.clouds) {
        if (c.d !== layer) continue;
        c.x += (c.v * c.d + this.wind * -30 * c.d) * dt;
        const S = this.sprites[c.sp], cw = S.W * c.s, ch = S.H * c.s;
        if (c.x > w + 60) c.x = -cw - 60; if (c.x < -cw - 80) c.x = w + 40;
        const px = c.x - this.mx * 40 * c.d;
        x.globalAlpha = c.a; x.drawImage(S.dark, px, c.y, cw, ch);
        if (flash > .02) {
          const near = 1 - Math.min(1, Math.abs(px + cw / 2 - fx) / (w * .55));
          x.globalAlpha = Math.min(1, flash * (.25 + near * .9)) * c.a; x.drawImage(S.lit, px, c.y, cw, ch);
        }
      }
      x.globalAlpha = 1;
    };
    drawClouds(.35); drawClouds(.65);
    // bolts sit between the cloud layers
    if (this.bolts.length) {
      x.save(); x.globalCompositeOperation = "lighter"; x.lineJoin = "round"; x.lineCap = "round";
      for (const b of this.bolts) {
        const v = this.brightness(b) * b.power; if (v < .01) continue;
        const path = (pts, lw, a, rgb) => { x.strokeStyle = `rgba(${rgb},${a})`; x.lineWidth = lw; x.beginPath(); x.moveTo(pts[0].x, pts[0].y); for (const p of pts) x.lineTo(p.x, p.y); x.stroke() };
        x.shadowColor = `rgba(${C.glow},${v})`; x.shadowBlur = 28;
        path(b.main, 9, .16 * v, C.glow);
        x.shadowBlur = 0;
        path(b.main, 3.6, .55 * v, C.glow);
        path(b.main, 1.6, Math.min(1, v * 1.2), C.bolt);
        for (const br of b.branches) { path(br, 3, .22 * v, C.glow); path(br, 1, .7 * v, C.bolt) }
      }
      x.restore();
    }
    drawClouds(1);
    // rain
    if (this.drops.length) {
      const wind = this.wind;
      for (let bucket = 0; bucket < 3; bucket++) {
        const lo = .25 + bucket * .25, hi = lo + .25 + (bucket === 2 ? .01 : 0);
        x.strokeStyle = `rgba(${C.rain},${(.12 + bucket * .12) * (1 + flash * 1.5)})`;
        x.lineWidth = .7 + bucket * .45; x.beginPath();
        for (const d of this.drops) {
          if (d.z < lo || d.z >= hi) continue;
          const vx = wind * d.v, vy = d.v;
          if (dt) { d.x += vx * dt; d.y += vy * dt }
          const k = d.len / Math.hypot(vx, vy);
          x.moveTo(d.x, d.y); x.lineTo(d.x - vx * k, d.y - vy * k);
          if (d.y > h + 10) {
            if (d.z > .75 && Math.random() < .35) for (let i = 0; i < 2; i++) this.splashes.push({ x: d.x, y: h - 2, vx: (Math.random() - .5) * 90, vy: -60 - Math.random() * 90, life: .35 });
            Object.assign(d, this.drop(false));
          }
          if (d.x > w + 220) d.x -= w + 400; else if (d.x < -220) d.x += w + 400;
        }
        x.stroke();
      }
      x.fillStyle = `rgba(${C.rain},.5)`;
      this.splashes = this.splashes.filter(s => (s.life -= dt) > 0);
      for (const s of this.splashes) { s.vy += 420 * dt; s.x += s.vx * dt; s.y += s.vy * dt; x.fillRect(s.x, s.y, 1.6, 1.6) }
    }
    // full-screen flash
    if (flash > .02) { x.fillStyle = `rgba(${C.bolt},${Math.min(.13, flash * .1)})`; x.fillRect(0, 0, w, h) }
  }
};
// jagged bolt via midpoint displacement
function bolt(x1, y1, x2, y2, disp, minLen){
  let pts = [{ x: x1, y: y1 }, { x: x2, y: y2 }];
  while (disp > minLen) {
    const next = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      next.push({ x: (a.x + b.x) / 2 + (Math.random() - .5) * disp, y: (a.y + b.y) / 2 + (Math.random() - .5) * disp * .35 }, b);
    }
    pts = next; disp /= 2;
  }
  return pts;
}
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }

const BOLT = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 14h7l-1.5 8L19 10h-7z"/></svg>`;

const THEMES = { thunderhead: "Thunderhead", overcast: "Overcast", supercell: "Supercell" };

function toast(msg){ const t = $("#toast"); t.innerHTML = BOLT + `<span>${esc(msg)}</span>`; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600) }

const posterImg = t => t?.poster ? `<img loading="lazy" src="${esc(t.poster)}" alt="">` : `<div class="noimg">${esc(t?.title || "?")}</div>`;
function card(t, rank){

}

// "Where to watch": TMDB's streaming/rent/buy data for the visitor's country (supplied by JustWatch).
function whereToWatch(t, stream){
  if (t.provider !== "tmdb" || t.type !== "movie" && t.type !== "tv") return "";
  const w = t.where, groups = [["flatrate", "Stream"], ["free", "Free"], ["ads", "Free with ads"], ["rent", "Rent"], ["buy", "Buy"]];
  const rows = w ? groups.filter(([k]) => w[k]?.length).map(([k, label]) => `<div class="where-row"><span class="where-label">${label}</span><div class="where-logos">${w[k].slice(0, 10).map(p => `<a href="${esc(w.link)}" target="_blank" rel="noopener" title="${esc(p.provider_name)}"><img src="https://image.tmdb.org/t/p/w92${esc(p.logo_path)}" alt="${esc(p.provider_name)}"></a>`).join("")}</div></div>`).join("") : "";
  if (!rows && stream) return "";
  return `<section class="sec"><div class="sec-h"><h2>Where to watch</h2><small>${REGION} · data from JustWatch</small></div>
    <div class="panel">${rows || `<p class="muted" style="margin:0">Not streaming anywhere in ${REGION} right now.</p>`}</div></section>`;
}

// Inline player: expands within the title page so reviews, cast and recommendations remain below it.
let closeTheater = null;
function theater(t, season = 1, episode = 1){
  closeTheater?.();
  const feature = app.querySelector(".feature");
  if (!feature) return;
  const el = document.createElement("section");
  el.className = "inline-player sec";
  el.setAttribute("aria-label", "Now playing: " + t.title);
  el.innerHTML = `<div class="sec-h"><div><div class="kicker" style="margin:0 0 4px">Now playing · Stellar</div><h2>${esc(t.title)}${t.type === "tv" ? ` · S${season} E${episode}` : ""}</h2></div><button class="btn small" id="thClose">Close ✕</button></div>
    <div class="th-frame" id="PlayerContainer"></div>
    <div class="th-foot muted">Video provided by Stellar.</div>`;
  const player = el.querySelector("#PlayerContainer");
  const stream = Streams.find(t, season, episode);
  if (!stream) {
    player.innerHTML = `<div class="panel" style="height:100%;display:grid;place-items:center;text-align:center;padding:24px"><p>This title does not have a numeric TMDB ID. Stellar embeds require a TMDB movie or series ID.</p></div>`;
  } else {
    const iframe = document.createElement("iframe");
    iframe.id = "stellar-player";
    iframe.src = stream.embed;
    iframe.title = `${t.title} · Stellar player`;
    iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allowFullscreen = true;
    player.appendChild(iframe);
  }
  feature.insertAdjacentElement("afterend", el);
  const playerOrigin = "https://stellar.rip";
  const getPlayerFrame = () => el.querySelector("#stellar-player");
  const initializePlayerMessages = () => {
    const frame = getPlayerFrame();
    frame?.contentWindow?.postMessage({ type: "STELLAR_EMBED_INIT" }, playerOrigin);
  };
  const onPlayerMessage = event => {
    const frame = getPlayerFrame();
    if (event.origin !== playerOrigin || event.source !== frame?.contentWindow) return;
    if (event.data?.type === "STELLAR_EMBED_READY") initializePlayerMessages();
    if (event.data?.type === "PLAYER_EVENT") {
      const payload = event.data.data || {};
      if (["play","pause","seeked","ended","timeupdate"].includes(payload.event)) {
        el.dataset.currentTime = String(Number(payload.currentTime) || 0);
        el.dataset.duration = String(Number(payload.duration) || 0);
      }
    }
  };
  const frame = getPlayerFrame();
  frame?.addEventListener("load", initializePlayerMessages);
  if (frame) initializePlayerMessages();
  window.addEventListener("message", onPlayerMessage);
  closeTheater = () => {
    el.remove();
    window.removeEventListener("message", onPlayerMessage);
    closeTheater = null;
    Storm.start();
  };
  el.querySelector("#thClose").onclick = closeTheater;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

      const add = e.target.dataset.add, rm = e.target.dataset.rm;
      if (add) { await act(() => Store.addFriend(add), "Friend added"); Views.friends() }
      if (rm && confirm(`Remove @${rm}?`)) { await act(() => Store.removeFriend(rm), "Removed"); Views.friends() }
    };
  },

  async user(name){
    const u = Store.me(); if (!u) return needLogin();
    app.innerHTML = skelGrid(6);
    const f = await act(() => Store.friendView(name));
    if (!f) { app.innerHTML = empty("Not on your list", `Add @${esc(name)} as a friend first. <a href="#/friends">Friends</a>`); return }
    if (!f.mutual) { app.innerHTML = `<h1>@${esc(name)}</h1>` + empty("Not shared yet", `@${esc(name)} hasn't added you back, so their diary is private for now.`); return }
    const T = id => f.titles[id] || { id, title: "Untitled" };
    const top = Object.entries(f.ratings).sort((a, b) => b[1].stars - a[1].stars || b[1].at - a[1].at).slice(0, 12).map(([id]) => T(id));
    app.innerHTML = `<h1>@${esc(name)}</h1>
      <section class="sec"><div class="sec-h"><h2>Recently watched</h2></div>${grid(f.history.slice(0, 12).map(h => T(h.id)))}</section>
      <section class="sec"><div class="sec-h"><h2>Top rated</h2></div>${grid(top)}</section>`;
  },

  login(){
    if (Store.me()) { location.hash = "#/"; return }
    const cloud = Store.mode === "cloud";
    app.innerHTML = `<div class="panel narrow">
      <h1 id="lt">Welcome back</h1>
      <div class="tabs"><button class="btn on" data-m="in">Sign in</button><button class="btn" data-m="up">Create account</button></div>
      <form id="lf">
        <label for="un">Username</label><input class="f" id="un" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="pw">Password</label><input class="f" id="pw" type="password" autocomplete="current-password" minlength="8" required>
        <div class="row" style="margin-top:18px"><button class="btn primary" id="go">${BOLT}Sign in</button></div>
        <p class="muted" style="font-size:12px;margin:16px 0 0">${cloud ? "Your account works on any device. Forgot your password? Ask whoever runs this site to reset it." : "Accounts are saved in this browser only. Passwords are hashed before they're stored."}</p>
      </form></div>`;
    let mode = "in";
    app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
      mode = b.dataset.m; app.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("on", x === b));
      $("#go").innerHTML = BOLT + (mode === "in" ? "Sign in" : "Create account");
      $("#lt").textContent = mode === "in" ? "Welcome back" : "Join the storm";
      $("#pw").autocomplete = mode === "in" ? "current-password" : "new-password";
    });
    $("#lf").onsubmit = async e => {
      e.preventDefault(); $("#go").disabled = true;
      const un = $("#un").value, pw = $("#pw").value;
      await act(() => mode === "in" ? Store.signIn({ login: un, password: pw }) : Store.signUp({ username: un, password: pw }));
      $("#go").disabled = false;
      if (Store.me()) { applyTheme(); Storm.strike({ big: true }); toast("Welcome, @" + Store.me().username); location.hash = "#/" }
    };
  },

  reset(){
    app.innerHTML = `<div class="panel narrow"><h1>New password</h1><form id="rf"><label for="np">Choose a new password</label><input class="f" id="np" type="password" minlength="8" autocomplete="new-password" required><div class="row" style="margin-top:16px"><button class="btn primary">Save password</button></div></form></div>`;
    $("#rf").onsubmit = async e => { e.preventDefault(); const ok = await act(() => Store.setPassword($("#np").value).then(() => true), "Password updated"); if (ok) location.hash = "#/" };
  },

  settings(){
    const u = Store.me(), th = document.documentElement.dataset.theme;
    const sw = { thunderhead: "linear-gradient(160deg,#04060b,#1a2336 70%,#7cc4ff)", overcast: "linear-gradient(160deg,#aeb8c6,#eef1f5 70%,#2c55d6)", supercell: "linear-gradient(160deg,#020604,#25351f 70%,#c4f26b)" };
    app.innerHTML = `<h1>Settings</h1>
      <div class="panel" style="max-width:720px">
        <div class="sec-h"><h2>Sky</h2></div>
        <div class="themes">${Object.entries(THEMES).map(([k, l]) => `<button class="theme-card ${k === th ? "on" : ""}" data-th="${k}"><div class="sw" style="background:${sw[k]}"></div><div>${l}</div></button>`).join("")}</div>

        <div class="sec-h" style="margin-top:30px"><h2>Weather</h2><small>Saved on this device</small></div>
        <div class="row">${Storm.order.map(k => `<button class="btn ${k === Storm.level ? "on" : ""}" data-wx="${k}">${Storm.levels[k].label}</button>`).join("")}</div>
        ${Storm.still ? `<p class="muted" style="font-size:13px">Your device asks for reduced motion, so the sky stays still.</p>` : ""}

        <div class="sec-h" style="margin-top:30px"><h2>Film data</h2></div>
        <p class="muted" style="margin-top:0">Now using <b>${Providers.active().label}</b>.</p>
        <label for="key">Your own TMDB API key or read access token (optional)</label>
        <input class="f" id="key" value="${esc(LocalStore.settings().tmdbKey || "")}" placeholder="${CONFIG.tmdbKey ? "Using the site's shared key" : "Paste from themoviedb.org → Settings → API"}" autocomplete="off" spellcheck="false">
        <div class="row" style="margin-top:10px"><button class="btn primary" id="saveKey">Save key</button><button class="btn" id="clrKey">Clear</button></div>

        <div class="sec-h" style="margin-top:30px"><h2>Account</h2><small>${Store.mode === "cloud" ? "Synced to the cloud" : "Saved in this browser"}</small></div>
        ${u ? `<p style="margin-top:0">Signed in as <b>@${esc(u.username)}</b></p>
          <div class="row"><button class="btn" id="out">Sign out</button><button class="btn" id="exp">Download my data</button><label class="btn" style="margin:0;color:var(--text)">Import data<input type="file" id="imp" accept="application/json" hidden></label><button class="btn danger" id="del">Delete account</button></div>`
          : `<a class="btn primary" href="#/login">Sign in or join</a>`}
      </div>`;
    app.querySelectorAll("[data-th]").forEach(b => b.onclick = async () => { document.documentElement.dataset.theme = b.dataset.th; await act(() => Store.setTheme(b.dataset.th)); applyTheme(); Views.settings() });
    app.querySelectorAll("[data-wx]").forEach(b => b.onclick = () => { Storm.setLevel(b.dataset.wx); wxButton(); Views.settings() });
    $("#saveKey").onclick = async () => {
      LocalStore.setSetting("tmdbKey", $("#key").value.trim()); memCache.clear(); try { sessionStorage.clear() } catch {}
      if (TMDBProvider.ready()) await act(() => TMDBProvider.get("/configuration"), "TMDB connected");
      route();
    };
    $("#clrKey").onclick = () => { LocalStore.setSetting("tmdbKey", ""); memCache.clear(); toast("Key cleared"); route() };
    if (!u) return;
    $("#out").onclick = async () => { await act(() => Store.signOut(), "Signed out"); applyTheme(); location.hash = "#/" };
    $("#exp").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(Store.exportMine(), null, 2)], { type: "application/json" })); a.download = `stormreel-${u.username}.json`; a.click() };
    $("#imp").onchange = async e => { const f = e.target.files[0]; if (!f) return; let o; try { o = JSON.parse(await f.text()) } catch { return toast("That file couldn't be read.") } await act(() => Store.importMine(o), "Imported"); route() };
    $("#del").onclick = async () => { if (confirm("Delete your account and everything in it? This can't be undone.")) { await act(() => Store.deleteAccount(), "Account deleted"); applyTheme(); location.hash = "#/" } };
  }
};

/* ---------- router ---------- */
function route(){
  const h = location.hash.slice(1) || "/";
  const [, seg = "", ...rest] = h.split("/");
  const arg = decodeURIComponent(rest.join("/"));
  chrome("/" + seg);
  closeTheater?.();
  app.onclick = null;
  app.style.animation = "none"; void app.offsetWidth; app.style.animation = "";
  window.scrollTo(0, 0);
  if (!seg) return Views.home();
  if (seg === "search") return Views.search(arg);
  if (seg === "title") return Views.title(arg);
  if (Views[seg]) return Views[seg](arg || undefined);
  app.innerHTML = empty("Lost in the fog", `That page doesn't exist. <a href="#/">Head home</a>`);
}

function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Couldn't load " + src)); document.head.appendChild(s) }) }

async function boot(){
  applyTheme();
  Storm.init();
  if (CONFIG.supabaseUrl && CONFIG.supabaseKey) {
    try { await loadScript(SUPABASE_JS); Store = CloudStore; await Store.init() }
    catch (e) { console.error(e); Store = LocalStore; setTimeout(() => toast("Couldn't reach the account server. Try again in a moment."), 300) }
  }
  // Supabase email links return as #access_token=... or #error=...; tidy those up.
  const h = location.hash;
  if (h && !h.startsWith("#/")) {
    const p = new URLSearchParams(h.slice(1));
    if (p.get("error_description")) setTimeout(() => toast(p.get("error_description").replace(/\+/g, " ")), 300);
    else if (Store.me()) setTimeout(() => toast("You're in, @" + Store.me().username), 300);
    history.replaceState(null, "", location.pathname + location.search + (Store.recovery ? "#/reset" : "#/"));
  } else if (Store.recovery) history.replaceState(null, "", location.pathname + "#/reset");
  applyTheme();
  $("#searchForm").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) { Storm.strike(); location.hash = "#/search/" + encodeURIComponent(q) } });
  $("#wx").addEventListener("click", () => { const o = Storm.order; Storm.setLevel(o[(o.indexOf(Storm.level) + 1) % o.length]); wxButton(); toast("Weather: " + Storm.cfg().label); if (location.hash === "#/settings") Views.settings() });
  $("#logo").addEventListener("click", () => { const r = $("#logo svg").getBoundingClientRect(); Storm.strike({ x: r.left + r.width / 2 }) });
  addEventListener("hashchange", route);
  route();
}
boot();
</script>
